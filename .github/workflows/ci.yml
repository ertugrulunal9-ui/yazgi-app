name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Dependency Policy
        run: npm run deps:policy

      - name: Security Audit (Prod Allowlist Gate)
        run: npm run audit:prod

      - name: Lint
        run: npm run lint

      - name: Tests (CI)
        run: npm run test:ci -- --watchAll=false

      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

      - name: Simulation Guardrail
        run: npm run simulate:ci
