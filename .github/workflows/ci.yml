name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

env:
  # GitHub announced Node 20 deprecation for JavaScript actions.
  # Opt in early to Node 24 runtime for actions.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  p0_p1_critical:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Critical Tests (P0/P1)
        run: npm run test:critical

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Dependency Policy
        run: npm run deps:policy

      - name: Security Audit (Prod Allowlist Gate)
        run: npm run audit:prod

      - name: Lint
        run: npm run lint

      - name: Tests (CI)
        run: npm run test:ci -- --watchAll=false

      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

      - name: Simulation Guardrail
        env:
          SIMULATION_RUNS: 100
        run: npm run simulate:ci
